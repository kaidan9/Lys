<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 920" role="img" aria-labelledby="title desc">
      <title id="title">Troisième République</title><desc id="desc">Présidence, gouvernement, deux chambres, collèges électoraux et Cour de justice selon le schéma III fourni.</desc><defs>
      <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#13263B"/><stop offset=".56" stop-color="#0C1928"/><stop offset="1" stop-color="#0A1420"/></linearGradient>
      <radialGradient id="glow" cx="50%" cy="0%" r="90%"><stop offset="0" stop-color="#45617E" stop-opacity=".22"/><stop offset="1" stop-color="#0A1420" stop-opacity="0"/></radialGradient>
      <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L6 3.5 L0 7 Z" fill="#D6C08A"/></marker>
      <filter id="shadow" x="-15%" y="-20%" width="130%" height="145%"><feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000" flood-opacity=".20"/></filter>
    </defs><style>
      .edge-path{fill:none;stroke:#D6C08A;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;opacity:.92}
      .edge-label rect{fill:#101C2A;stroke:#796A47;stroke-width:1}
      .edge-label text{font:600 13px Georgia,serif;fill:#F1E2BD}
      .node{filter:url(#shadow)}
      .node-role{font:800 10px 'DM Sans',Arial,sans-serif;letter-spacing:1.5px}
      .node-title{font-family:Georgia,'Times New Roman',serif;font-weight:700;fill:#fff}
      .node-detail{font-family:Georgia,'Times New Roman',serif;font-size:14px;fill:#DCE4ED}
      .legend-text{font:700 10px 'DM Sans',Arial,sans-serif;letter-spacing:1px;fill:#A7B7C8}
    </style>
      <rect x="8" y="8" width="1664" height="904" rx="26" fill="url(#bg)" stroke="#344D67" stroke-width="1.4"/>
      <rect x="8" y="8" width="1664" height="904" rx="26" fill="url(#glow)"/>
      <g class="edges"><path d="M720 174 V220 H350 V270" class="edge-path" marker-end="url(#arrow)"/><g class="edge-label"><rect x="460.0" y="205" width="100" height="30" rx="9"/><text x="510" y="225" text-anchor="middle">nomme</text></g><path d="M550 330 H1130" class="edge-path" marker-end="url(#arrow)"/><g class="edge-label"><rect x="785.0" y="285" width="110" height="30" rx="9"/><text x="840" y="305" text-anchor="middle">dirige</text></g><path d="M535 390 V445 H612 V505" class="edge-path" marker-start="url(#arrow)" marker-end="url(#arrow)"/><path d="M445 725 V680 H612 V631" class="edge-path" marker-end="url(#arrow)"/><g class="edge-label"><rect x="440.0" y="665" width="160" height="30" rx="9"/><text x="520" y="685" text-anchor="middle">élit la Chambre</text></g><path d="M1165 725 V680 H1015 V631" class="edge-path" marker-end="url(#arrow)"/><g class="edge-label"><rect x="1030.0" y="665" width="140" height="30" rx="9"/><text x="1100" y="685" text-anchor="middle">élit le Sénat</text></g></g><g class="edge-label"><rect x="400" y="461" width="250" height="30" rx="9"/><text x="525" y="481" text-anchor="middle">propose les lois · contrôle le gouvernement</text></g><g class="nodes"><g class="node node-exec" id="node-president">
      <rect x="620" y="58" width="440" height="116" rx="20" fill="#173A5B" stroke="#79B8E8" stroke-width="2"/>
      <path d="M 638 78 V 154" stroke="#79B8E8" stroke-width="4" stroke-linecap="round"/>
      <text x="656" y="85" class="node-role" fill="#DDEEFF">EXÉCUTIF</text>
      <text x="840.0" y="111" class="node-title" font-size="20" text-anchor="middle">PRÉSIDENT DE LA RÉPUBLIQUE</text><text x="840.0" y="144" class="node-detail" text-anchor="middle">Mandat de 7 ans · promulgue les lois</text>
    </g><g class="node node-exec" id="node-president-council">
      <rect x="150" y="270" width="400" height="120" rx="20" fill="#173A5B" stroke="#79B8E8" stroke-width="2"/>
      <path d="M 168 290 V 370" stroke="#79B8E8" stroke-width="4" stroke-linecap="round"/>
      <text x="186" y="297" class="node-role" fill="#DDEEFF">EXÉCUTIF</text>
      <text x="350.0" y="323" class="node-title" font-size="23" text-anchor="middle">PRÉSIDENT DU CONSEIL</text><text x="350.0" y="356" class="node-detail" text-anchor="middle">Dirige le gouvernement</text>
    </g><g class="node node-exec" id="node-ministers">
      <rect x="1130" y="270" width="400" height="120" rx="20" fill="#173A5B" stroke="#79B8E8" stroke-width="2"/>
      <path d="M 1148 290 V 370" stroke="#79B8E8" stroke-width="4" stroke-linecap="round"/>
      <text x="1166" y="297" class="node-role" fill="#DDEEFF">EXÉCUTIF</text>
      <text x="1330.0" y="323" class="node-title" font-size="23" text-anchor="middle">MINISTRES</text><text x="1330.0" y="356" class="node-detail" text-anchor="middle">Cabinet gouvernemental</text>
    </g><g class="node node-cons" id="node-national-assembly">
      <rect x="35" y="505" width="340" height="120" rx="20" fill="#352D54" stroke="#AFA1E1" stroke-width="2"/>
      <path d="M 53 525 V 605" stroke="#AFA1E1" stroke-width="4" stroke-linecap="round"/>
      <text x="71" y="532" class="node-role" fill="#EAE4FF">INSTITUTION</text>
      <text x="205.0" y="558" class="node-title" font-size="23" text-anchor="middle">ASSEMBLÉE NATIONALE</text><text x="205.0" y="591" class="node-detail" text-anchor="middle">Révision de la Constitution</text>
    </g><g class="node node-leg" id="node-chamber">
      <rect x="425" y="505" width="375" height="126" rx="20" fill="#542536" stroke="#E18C9B" stroke-width="2"/>
      <path d="M 443 525 V 611" stroke="#E18C9B" stroke-width="4" stroke-linecap="round"/>
      <text x="461" y="532" class="node-role" fill="#FFE1E5">LÉGISLATIF</text>
      <text x="612.5" y="558" class="node-title" font-size="23" text-anchor="middle">CHAMBRE DES DÉPUTÉS</text><text x="612.5" y="591" class="node-detail" text-anchor="middle">500 à 600 membres · 4 ans</text>
    </g><g class="node node-leg" id="node-senate">
      <rect x="845" y="505" width="340" height="126" rx="20" fill="#542536" stroke="#E18C9B" stroke-width="2"/>
      <path d="M 863 525 V 611" stroke="#E18C9B" stroke-width="4" stroke-linecap="round"/>
      <text x="881" y="532" class="node-role" fill="#FFE1E5">LÉGISLATIF</text>
      <text x="1015.0" y="558" class="node-title" font-size="23" text-anchor="middle">SÉNAT</text><text x="1015.0" y="591" class="node-detail" text-anchor="middle">300 membres · 9 ans</text>
    </g><g class="node node-jud" id="node-court">
      <rect x="1260" y="505" width="355" height="120" rx="20" fill="#174237" stroke="#78B99D" stroke-width="2"/>
      <path d="M 1278 525 V 605" stroke="#78B99D" stroke-width="4" stroke-linecap="round"/>
      <text x="1296" y="532" class="node-role" fill="#DDF7EA">JUDICIAIRE</text>
      <text x="1437.5" y="558" class="node-title" font-size="23" text-anchor="middle">COUR DE JUSTICE</text><text x="1437.5" y="591" class="node-detail" text-anchor="middle">Volet juridictionnel du schéma</text>
    </g><g class="node node-elect" id="node-electorate">
      <rect x="205" y="725" width="480" height="100" rx="20" fill="#51401C" stroke="#D9B96F" stroke-width="2"/>
      <path d="M 223 745 V 805" stroke="#D9B96F" stroke-width="4" stroke-linecap="round"/>
      <text x="241" y="752" class="node-role" fill="#FFF0C6">CORPS ÉLECTORAL</text>
      <text x="445.0" y="778" class="node-title" font-size="23" text-anchor="middle">CORPS ÉLECTORAL</text><text x="445.0" y="811" class="node-detail" text-anchor="middle">Hommes français de plus de 21 ans</text>
    </g><g class="node node-elect" id="node-college">
      <rect x="900" y="725" width="535" height="100" rx="20" fill="#51401C" stroke="#D9B96F" stroke-width="2"/>
      <path d="M 918 745 V 805" stroke="#D9B96F" stroke-width="4" stroke-linecap="round"/>
      <text x="936" y="752" class="node-role" fill="#FFF0C6">CORPS ÉLECTORAL</text>
      <text x="1167.5" y="778" class="node-title" font-size="23" text-anchor="middle">COLLÈGE ÉLECTORAL</text><text x="1167.5" y="811" class="node-detail" text-anchor="middle">Élus départementaux, d’arrondissement et municipaux</text>
    </g></g>
      <path d="M64 857 H1616" stroke="#53677C" stroke-opacity=".38"/>
      <g class="legend"><rect x="80" y="870" width="14" height="14" rx="4" fill="#173A5B" stroke="#79B8E8"/><text x="103" y="882" class="legend-text">EXÉCUTIF</text><rect x="360" y="870" width="14" height="14" rx="4" fill="#542536" stroke="#E18C9B"/><text x="383" y="882" class="legend-text">LÉGISLATIF</text><rect x="680" y="870" width="14" height="14" rx="4" fill="#51401C" stroke="#D9B96F"/><text x="703" y="882" class="legend-text">CORPS ÉLECTORAL</text><rect x="1050" y="870" width="14" height="14" rx="4" fill="#174237" stroke="#78B99D"/><text x="1073" y="882" class="legend-text">JUDICIAIRE</text><rect x="1330" y="870" width="14" height="14" rx="4" fill="#352D54" stroke="#AFA1E1"/><text x="1353" y="882" class="legend-text">INSTITUTION</text></g>
    </svg>