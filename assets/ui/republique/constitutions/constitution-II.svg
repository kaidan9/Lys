      .edge-label rect{fill:#101C2A;stroke:#796A47;stroke-width:1}
      .edge-label text{font:600 13px Georgia,serif;fill:#F1E2BD}
      .node{filter:url(#shadow)}
      .node-role{font:800 10px 'DM Sans',Arial,sans-serif;letter-spacing:1.5px}
      .node-title{font-family:Georgia,'Times New Roman',serif;font-weight:700;fill:#fff}
      .node-detail{font-family:Georgia,'Times New Roman',serif;font-size:14px;fill:#DCE4ED}
      .legend-text{font:700 10px 'DM Sans',Arial,sans-serif;letter-spacing:1px;fill:#A7B7C8}
    </style>
      <rect x="8" y="8" width="1664" height="884" rx="26" fill="url(#bg)" stroke="#344D67" stroke-width="1.4"/>
      <rect x="8" y="8" width="1664" height="884" rx="26" fill="url(#glow)"/>
      <g class="edges"><path d="M840 180 V260" class="edge-path" marker-end="url(#arrow)"/><g class="edge-label"><rect x="840.0" y="205" width="120" height="30" rx="9"/><text x="900" y="225" text-anchor="middle">nomme</text></g><path d="M620 145 L485 465" class="edge-path" marker-end="url(#arrow)"/><g class="edge-label"><rect x="465.0" y="315" width="120" height="30" rx="9"/><text x="525" y="335" text-anchor="middle">nomme</text></g><path d="M1060 145 L1195 465" class="edge-path" marker-end="url(#arrow)"/><g class="edge-label"><rect x="1095.0" y="315" width="120" height="30" rx="9"/><text x="1155" y="335" text-anchor="middle">nomme</text></g><path d="M840 362 V465" class="edge-path" marker-end="url(#arrow)"/><path d="M540 690 V205 H620 V180" class="edge-path" marker-end="url(#arrow)"/><g class="edge-label"><rect x="475.0" y="610" width="170" height="30" rx="9"/><text x="560" y="630" text-anchor="middle">élit / plébiscite</text></g></g><g class="nodes"><g class="node node-exec" id="node-head-state">
      <rect x="620" y="62" width="440" height="118" rx="20" fill="#173A5B" stroke="#79B8E8" stroke-width="2"/>
      <path d="M 638 82 V 160" stroke="#79B8E8" stroke-width="4" stroke-linecap="round"/>
      <text x="656" y="89" class="node-role" fill="#DDEEFF">EXÉCUTIF</text>
      <text x="840.0" y="115" class="node-title" font-size="23" text-anchor="middle">PRÉSIDENT PUIS EMPEREUR</text><text x="840.0" y="148" class="node-detail" text-anchor="middle">Pouvoir exécutif central</text>
    </g><g class="node node-exec" id="node-ministers">
