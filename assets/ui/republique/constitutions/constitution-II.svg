      <text x="725.0" y="743" class="node-title" font-size="20" text-anchor="middle">SUFFRAGE UNIVERSEL MASCULIN</text><text x="725.0" y="776" class="node-detail" text-anchor="middle">21 ans</text>
    </g><g class="node node-muted" id="node-women">
      <rect x="1205" y="690" width="410" height="96" rx="20" fill="#273548" stroke="#8294A8" stroke-width="2"/>
      <path d="M 1223 710 V 766" stroke="#8294A8" stroke-width="4" stroke-linecap="round"/>
      <text x="1241" y="717" class="node-role" fill="#D4DEE9">HORS DU CORPS ÉLECTORAL</text>
      <text x="1410.0" y="743" class="node-title" font-size="23" text-anchor="middle">FEMMES</text><text x="1410.0" y="776" class="node-detail" text-anchor="middle">Hors du corps électoral représenté</text>
    </g></g>
