<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 900" role="img" aria-labelledby="title desc">
      <title id="title">Président puis Empereur</title><desc id="desc">Le document II présente le chef de l’État, les ministres, le Conseil d’État, le Corps législatif, le Sénat et le suffrage masculin.</desc><defs>
      <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#13263B"/><stop offset=".56" stop-color="#0C1928"/><stop offset="1" stop-color="#0A1420"/></linearGradient>
      <radialGradient id="glow" cx="50%" cy="0%" r="90%"><stop offset="0" stop-color="#45617E" stop-opacity=".22"/><stop offset="1" stop-color="#0A1420" stop-opacity="0"/></radialGradient>
      <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L6 3.5 L0 7 Z" fill="#D6C08A"/></marker>
      <filter id="shadow" x="-15%" y="-20%" width="130%" height="145%"><feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000" flood-opacity=".20"/></filter>
    </defs><style>
