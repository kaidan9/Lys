<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 900" role="img" aria-labelledby="title desc">
      <title id="title">Première République · Constitution de l’an III — Directoire</title><desc id="desc">Organisation des cinq directeurs, des deux conseils et du corps électoral selon le schéma transmis.</desc><defs>
      <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#13263B"/><stop offset=".56" stop-color="#0C1928"/><stop offset="1" stop-color="#0A1420"/></linearGradient>
      <radialGradient id="glow" cx="50%" cy="0%" r="90%"><stop offset="0" stop-color="#45617E" stop-opacity=".22"/><stop offset="1" stop-color="#0A1420" stop-opacity="0"/></radialGradient>
      <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L6 3.5 L0 7 Z" fill="#D6C08A"/></marker>
      <filter id="shadow" x="-15%" y="-20%" width="130%" height="145%"><feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000" flood-opacity=".20"/></filter>
    </defs><style>
      .edge-path{fill:none;stroke:#D6C08A;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;opacity:.92}
      .edge-label rect{fill:#101C2A;stroke:#796A47;stroke-width:1}
      .edge-label text{font:600 13px Georgia,serif;fill:#F1E2BD}
      .node{filter:url(#shadow)}
      .node-role{font:800 10px 'DM Sans',Arial,sans-serif;letter-spacing:1.5px}
      .node-title{font-family:Georgia,'Times New Roman',serif;font-weight:700;fill:#fff}
      .node-detail{font-family:Georgia,'Times New Roman',serif;font-size:14px;fill:#DCE4ED}
      .legend-text{font:700 10px 'DM Sans',Arial,sans-serif;letter-spacing:1px;fill:#A7B7C8}
    </style>
      <rect x="8" y="8" width="1664" height="884" rx="26" fill="url(#bg)" stroke="#344D67" stroke-width="1.4"/>
      <rect x="8" y="8" width="1664" height="884" rx="26" fill="url(#glow)"/>
      <g class="edges"><path d="M355 330 V270 H735 V183" class="edge-path" marker-end="url(#arrow)"/><path d="M1325 330 V270 H945 V183" class="edge-path" marker-end="url(#arrow)"/><path d="M1075 394 H605" class="edge-path" marker-end="url(#arrow)"/><g class="edge-label"><rect x="745.0" y="342" width="190" height="30" rx="9"/><text x="840" y="362" text-anchor="middle">Propose puis vote</text></g><path d="M840 565 V515 H355 V458" class="edge-path" marker-end="url(#arrow)"/><path d="M840 515 H1325 V458" class="edge-path" marker-end="url(#arrow)"/><g class="edge-label"><rect x="745.0" y="470" width="190" height="30" rx="9"/><text x="840" y="490" text-anchor="middle">forment les conseils</text></g><path d="M840 735 V659" class="edge-path" marker-end="url(#arrow)"/><g class="edge-label"><rect x="840.0" y="677" width="200" height="30" rx="9"/><text x="940" y="697" text-anchor="middle">élisent les électeurs</text></g></g><g class="nodes"><g class="node node-exec" id="node-directory">
      <rect x="620" y="65" width="440" height="118" rx="20" fill="#173A5B" stroke="#79B8E8" stroke-width="2"/>
      <path d="M 638 85 V 163" stroke="#79B8E8" stroke-width="4" stroke-linecap="round"/>
      <text x="656" y="92" class="node-role" fill="#DDEEFF">EXÉCUTIF</text>
      <text x="840.0" y="118" class="node-title" font-size="23" text-anchor="middle">DIRECTOIRE</text><text x="840.0" y="151" class="node-detail" text-anchor="middle">5 membres · nomment les ministres</text><text x="840.0" y="171" class="node-detail" text-anchor="middle">Exécutent les lois · dirigent armée et police</text>
    </g><g class="node node-leg" id="node-ancients">
      <rect x="105" y="330" width="500" height="128" rx="20" fill="#542536" stroke="#E18C9B" stroke-width="2"/>
      <path d="M 123 350 V 438" stroke="#E18C9B" stroke-width="4" stroke-linecap="round"/>
      <text x="141" y="357" class="node-role" fill="#FFE1E5">LÉGISLATIF</text>
      <text x="355.0" y="383" class="node-title" font-size="23" text-anchor="middle">CONSEIL DES ANCIENS</text><text x="355.0" y="416" class="node-detail" text-anchor="middle">40 ans minimum</text><text x="355.0" y="436" class="node-detail" text-anchor="middle">Vote les lois</text>
    </g><g class="node node-leg" id="node-five-hundred">
      <rect x="1075" y="330" width="500" height="128" rx="20" fill="#542536" stroke="#E18C9B" stroke-width="2"/>
      <path d="M 1093 350 V 438" stroke="#E18C9B" stroke-width="4" stroke-linecap="round"/>
      <text x="1111" y="357" class="node-role" fill="#FFE1E5">LÉGISLATIF</text>
      <text x="1325.0" y="383" class="node-title" font-size="23" text-anchor="middle">CONSEIL DES 500</text><text x="1325.0" y="416" class="node-detail" text-anchor="middle">30 ans minimum</text><text x="1325.0" y="436" class="node-detail" text-anchor="middle">Propose les lois</text>
    </g><g class="node node-elect" id="node-electors">
      <rect x="620" y="565" width="440" height="94" rx="20" fill="#51401C" stroke="#D9B96F" stroke-width="2"/>
      <path d="M 638 585 V 639" stroke="#D9B96F" stroke-width="4" stroke-linecap="round"/>
      <text x="656" y="592" class="node-role" fill="#FFF0C6">CORPS ÉLECTORAL</text>
      <text x="840.0" y="618" class="node-title" font-size="23" text-anchor="middle">30 000 ÉLECTEURS</text><text x="840.0" y="651" class="node-detail" text-anchor="middle">Collège électoral</text>
    </g><g class="node node-elect" id="node-active-citizens">
      <rect x="500" y="735" width="680" height="100" rx="20" fill="#51401C" stroke="#D9B96F" stroke-width="2"/>
      <path d="M 518 755 V 815" stroke="#D9B96F" stroke-width="4" stroke-linecap="round"/>
      <text x="536" y="762" class="node-role" fill="#FFF0C6">CORPS ÉLECTORAL</text>
      <text x="840.0" y="788" class="node-title" font-size="20" text-anchor="middle">6 MILLIONS DE CITOYENS ACTIFS</text><text x="840.0" y="821" class="node-detail" text-anchor="middle">Hommes de plus de 21 ans payant l’impôt</text>
    </g></g>
      <path d="M64 837 H1616" stroke="#53677C" stroke-opacity=".38"/>
      <g class="legend"><rect x="80" y="850" width="14" height="14" rx="4" fill="#173A5B" stroke="#79B8E8"/><text x="103" y="862" class="legend-text">EXÉCUTIF</text><rect x="360" y="850" width="14" height="14" rx="4" fill="#542536" stroke="#E18C9B"/><text x="383" y="862" class="legend-text">LÉGISLATIF</text><rect x="680" y="850" width="14" height="14" rx="4" fill="#51401C" stroke="#D9B96F"/><text x="703" y="862" class="legend-text">CORPS ÉLECTORAL</text><rect x="1050" y="850" width="14" height="14" rx="4" fill="#174237" stroke="#78B99D"/><text x="1073" y="862" class="legend-text">JUDICIAIRE</text><rect x="1330" y="850" width="14" height="14" rx="4" fill="#352D54" stroke="#AFA1E1"/><text x="1353" y="862" class="legend-text">INSTITUTION</text></g>
    </svg>